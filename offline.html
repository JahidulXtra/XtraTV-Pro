<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#030303" />
    <meta name="robots" content="noindex" />
    <title>You're offline — Xtra TV Pro</title>
    <link rel="icon" type="image/svg+xml" href="/svg/logo.svg" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: #030303;
        color: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        text-align: center;
      }
      .logo {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        border-radius: 16px;
        background: linear-gradient(135deg, #6366f1, #a855f7);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .logo svg {
        width: 34px;
        height: 34px;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #a1a1aa;
        margin: 0 0 28px;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #a1a1aa;
        margin-bottom: 24px;
        padding: 6px 14px;
        border: 1px solid #27272a;
        border-radius: 999px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #f43f5e;
        box-shadow: 0 0 8px #f43f5e99;
      }
      .status.online .dot {
        background: #10b981;
        box-shadow: 0 0 8px #10b98199;
      }
      button {
        appearance: none;
        border: none;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        color: #fff;
        padding: 12px 28px;
        border-radius: 10px;
        background: linear-gradient(135deg, #6366f1, #a855f7);
        box-shadow: 0 8px 20px #6366f14d;
        transition: opacity 0.15s ease, transform 0.15s ease;
      }
      button:active {
        transform: scale(0.97);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .hint {
        margin-top: 20px;
        font-size: 12px;
        color: #52525b;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M20 26a12 12 0 0 1 24 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
          <path d="M24.5 29.5a7 7 0 0 1 15 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
          <rect x="16" y="30" width="32" height="22" rx="4" fill="#0b0b0f"/>
          <path d="M28 36.5 L40 41.5 L28 46.5 Z" fill="#fff"/>
        </svg>
      </div>
      <h1>No internet connection</h1>
      <p>
        Xtra TV Pro needs an internet connection to load channels and stream
        live TV. Check your connection and try again.
      </p>
      <div class="status" id="status">
        <span class="dot"></span>
        <span id="status-text">Offline</span>
      </div>
      <div>
        <button id="retry-btn">Try again</button>
      </div>
      <p class="hint">This page will reload automatically once you're back online.</p>
    </div>

    <script>
      var statusEl = document.getElementById("status");
      var statusText = document.getElementById("status-text");
      var retryBtn = document.getElementById("retry-btn");

      function updateStatus() {
        if (navigator.onLine) {
          statusEl.classList.add("online");
          statusText.textContent = "Back online";
          retryBtn.disabled = false;
        } else {
          statusEl.classList.remove("online");
          statusText.textContent = "Offline";
          retryBtn.disabled = false;
        }
      }

      function goHome() {
        window.location.href = "/";
      }

      retryBtn.addEventListener("click", function () {
        if (navigator.onLine) {
          goHome();
        } else {
          retryBtn.disabled = true;
          statusText.textContent = "Checking...";
          fetch("/", { cache: "no-store" })
            .then(function () {
              goHome();
            })
            .catch(function () {
              retryBtn.disabled = false;
              updateStatus();
            });
        }
      });

      // Auto-redirect as soon as the browser detects connectivity again.
      window.addEventListener("online", function () {
        updateStatus();
        goHome();
      });
      window.addEventListener("offline", updateStatus);

      updateStatus();
    </script>
  </body>
</html>
